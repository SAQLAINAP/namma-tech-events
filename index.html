<meta charset="utf-8">
<title>Namma Tech Events</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: minimal Swiss app — sticky top bar (brand · sections · theme), Discover = filter panel + results stage, Calendar = month grid + day list; phones get a bottom tab bar and a slide-up filter sheet. */
:root{
  --bg:#f5f5f2; --sheet:#ffffff; --sunk:#efefeb; --ink:#171717; --ink-2:#5b5b58; --ink-3:#8f8f8a; --line:#e3e3de; --line-2:#cfcfca;
  --accent:#e04a2f; --accent-ink:#ffffff; --accent-soft:#fbe6e1;
  --ok:#1f8a5f; --warn:#a96a00;
  --tint:14%; --shadow:0 1px 2px rgba(20,20,18,.05),0 6px 20px rgba(20,20,18,.07);
  --f-sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --r-s:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --sheet:#191919; --sunk:#151515; --ink:#ececE8; --ink-2:#a9a9a4; --ink-3:#74746f; --line:#2a2a28; --line-2:#3a3a37;
  --accent:#ff6b4f; --accent-ink:#140a07; --accent-soft:#3a1d17; --ok:#4cc995; --warn:#f0b04a;
  --tint:22%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --sheet:#191919; --sunk:#151515; --ink:#ececE8; --ink-2:#a9a9a4; --ink-3:#74746f; --line:#2a2a28; --line-2:#3a3a37;
  --accent:#ff6b4f; --accent-ink:#140a07; --accent-soft:#3a1d17; --ok:#4cc995; --warn:#f0b04a;
  --tint:22%; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(28px,3.6vw,40px);font-stretch:92%}
h2{font-size:19px}
h3{font-size:17px}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.sub{color:var(--ink-2);max-width:62ch}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dc)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex:none}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.02em}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.nav button{all:unset;cursor:pointer;padding:7px 12px;border-radius:var(--r-s);font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.nav button:hover{color:var(--ink);background:var(--sunk)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.nav .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.theme{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sheet);flex:none}
.theme button{all:unset;cursor:pointer;width:30px;height:26px;display:grid;place-items:center;border-radius:999px;color:var(--ink-3)}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme svg{width:15px;height:15px}

/* page shell */
.wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
.disc{display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;align-items:start;padding-block:24px 80px}
.stage{display:flex;flex-direction:column;gap:36px;min-width:0}

/* filter panel */
.panel{position:sticky;top:calc(var(--th,61px) + 20px);max-height:calc(100vh - var(--th,61px) - 40px);overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding-right:4px;scrollbar-width:thin}
.panel-head{display:none}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fgroup h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.fgroup h4 .lbl{color:var(--ink-2)}
.opt{display:grid;grid-template-columns:16px 10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:5px 8px;margin-inline:-8px;border-radius:var(--r-s);cursor:pointer;font-size:14px;color:var(--ink-2)}
.opt:hover{background:var(--sunk);color:var(--ink)}
.opt input{margin:0;width:15px;height:15px;accent-color:var(--ink)}
.opt.radio{grid-template-columns:16px minmax(0,1fr) auto}
.opt.nodot{grid-template-columns:16px minmax(0,1fr) auto}
.opt:has(input:checked){color:var(--ink);font-weight:600}
.opt .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.opt .sq{width:10px;height:10px;border-radius:3px;background:var(--dc)}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:5px 0 0}
.panel{gap:0}
.ptop{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px}
.acc{border-top:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 0;cursor:pointer;font-size:13.5px;font-weight:650}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{color:var(--accent)}
.acc-r{display:inline-flex;align-items:center;gap:8px}
.badge{font-family:var(--f-mono);font-size:10.5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center}
.chev{width:7px;height:7px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.acc[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.acc-body{padding:0 0 12px;display:flex;flex-direction:column;gap:0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.wbtn{all:unset;cursor:pointer;text-align:center;padding:6px 4px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.wbtn:hover{color:var(--ink);border-color:var(--line-2)}
.wbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:3px 9px;font-size:12px}
.sw-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:650;cursor:pointer}
.toggle{appearance:none;-webkit-appearance:none;margin:0;width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle:checked{background:var(--ink)}
.toggle:checked::after{left:16px}
.fresh{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.fresh:hover{color:var(--ink)}
.fresh svg{width:15px;height:15px;flex:none}
.tools{display:flex;gap:8px;align-items:center}
.selwrap{position:relative;display:inline-flex}
.selwrap select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:9px 30px 9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.selwrap::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.src a{text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{color:var(--accent)}
.src .mono{font-size:11px;color:var(--ink-3)}
.state{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.state.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.state.due{background:var(--accent-soft);color:var(--accent)}
.more:hover{color:var(--ink)}
.linkbtn{all:unset;cursor:pointer;font-size:12px;color:var(--ink-3)}
.linkbtn:hover{color:var(--accent)}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;min-width:0}
.search:focus-within{border-color:var(--line-2);box-shadow:0 0 0 3px var(--sunk)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);padding:3px;background:var(--sheet)}
.seg button{all:unset;cursor:pointer;padding:5px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.seg svg{width:15px;height:15px}
.btn.fbtn{display:none}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .x{opacity:.6;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.resultbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* section heads */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head .left{display:flex;align-items:center;gap:10px;min-width:0}
.sec-head .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.sec-head button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sec-head button:hover{color:var(--accent)}

/* cards */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:232px;gap:14px;overflow-x:auto;padding:2px 2px 12px;margin:-2px;scroll-snap-type:x proximity;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:14px}
.card{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-snap-align:start;min-width:0;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.c-art{position:relative;background:color-mix(in srgb,var(--dc) var(--tint),var(--sheet));padding:12px 14px 14px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.c-art .wm{position:absolute;right:10px;bottom:-14px;font-weight:800;font-stretch:75%;font-size:76px;line-height:1;color:var(--dc);opacity:.16;letter-spacing:-.03em;pointer-events:none}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.c-dom{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--sheet);color:var(--ink);white-space:nowrap;border:1px solid var(--line)}
.when.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.c-date{display:flex;align-items:baseline;gap:8px;position:relative}
.c-date b{font-weight:700;font-stretch:80%;font-size:46px;line-height:.9;letter-spacing:-.03em}
.c-date span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);text-transform:uppercase}
.c-body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-title{font-weight:650;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:1px;min-width:0}
.c-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);margin-top:auto}
.plat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat i{width:8px;height:8px;border-radius:2px;flex:none}
.ver{font-size:11.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.ver.hi{color:var(--ok)} .ver.md{color:var(--warn)}
.past{opacity:.5}
.flairs{display:flex;flex-wrap:wrap;gap:5px}
.fl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:color-mix(in srgb,var(--fb) 18%,transparent);color:var(--ink);white-space:nowrap}
.fl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fb)}
.fl.inf{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-2)}

/* list rows */
.list{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:4px 52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px 12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .bar{align-self:stretch;background:var(--dc);margin-block:-12px}
.li-date{text-align:center;line-height:1}
.li-date b{font-weight:700;font-stretch:80%;font-size:26px;display:block}
.li-date span{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;color:var(--ink-3)}
.li-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.li-main b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero-l{background:color-mix(in srgb,var(--dc) var(--tint),var(--sheet));padding:22px;display:flex;flex-direction:column;justify-content:space-between;min-height:230px;position:relative;overflow:hidden}
.hero-l .wm{position:absolute;right:-4px;bottom:-30px;font-weight:800;font-stretch:75%;font-size:180px;line-height:1;color:var(--dc);opacity:.14;pointer-events:none}
.hero-l b{font-weight:700;font-stretch:78%;font-size:clamp(80px,9vw,120px);line-height:.85;letter-spacing:-.04em;position:relative}
.hero-r{padding:24px 26px;display:flex;flex-direction:column;gap:14px;min-width:0;justify-content:center}
.hero-r h2{font-size:clamp(22px,2.6vw,30px);font-stretch:92%}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px}
.facts div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts span{font-weight:600;overflow-wrap:anywhere}

.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r-s);background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:14px;text-decoration:none;white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* domain banner */
.banner{background:color-mix(in srgb,var(--dc) var(--tint),var(--sheet));border-radius:14px;padding:20px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.banner .wm{position:absolute;right:0;bottom:-34px;font-weight:800;font-stretch:75%;font-size:150px;line-height:1;color:var(--dc);opacity:.14;pointer-events:none}
.banner>*{position:relative}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;align-items:start;padding-block:24px 80px}
.cal{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.cal-head .seg button{padding:4px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
.day{all:unset;cursor:pointer;box-sizing:border-box;min-height:84px;padding:8px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--sunk)}
.day.out{color:var(--ink-3);background:var(--sunk)}
.day.out:hover{background:var(--bg)}
.day .d{font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.day .c{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.day.today .d>span:first-child{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.day .dots{display:flex;flex-wrap:wrap;gap:3px}
.day .dots i{width:7px;height:7px;border-radius:50%}
.daypanel{position:sticky;top:calc(var(--th,61px) + 20px);display:flex;flex-direction:column;gap:14px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:20;animation:fade .15s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--sheet);z-index:21;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .2s ease}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(24px);opacity:.6}}
.d-top{background:color-mix(in srgb,var(--dc) var(--tint),var(--sheet));padding:20px 22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:22px;flex:none}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pad = n => String(n).padStart(2,"0");
const parseISO = s => { if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const dayDiff = (a,b) => Math.round((a-b)/864e5);
const fmtDate = e => { const d=parseISO(e.date); if(!d) return "Date TBC"; let s=`${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; const e2=parseISO(e.endDate); if(e2&&e.endDate!==e.date) s+=` – ${e2.getDate()} ${MON[e2.getMonth()]}`; return s; };
const isPast = e => { const d=parseISO(e.endDate||e.date); return d && d<today; };
const onDay = (e,q) => { const d=parseISO(e.date), e2=parseISO(e.endDate)||d, x=parseISO(q); return !!(d&&x&&x>=d&&x<=e2); };
function whenLabel(e){
  const d=parseISO(e.date), e2=parseISO(e.endDate)||d; if(!d) return null;
  if(e2<today) return ["Ended",""]; if(d<=today) return ["Today","now"]; const n=dayDiff(d,today);
  return n===1?["Tomorrow","now"]:n<=7?[`In ${n} days`,""]:null;
}
const whenHTML = e => { const w=whenLabel(e); return w?`<span class="when ${w[1]}">${w[0]}</span>`:""; };
const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : null;
function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
/* listed = stated as a perk or price; outlined = only mentioned in the description */
function flairsOf(e){
  const perks=(e.perks||[]).join(" "), text=[e.title,e.description,...(e.tags||[])].join(" ");
  return FLAIRS.map(f=>{
    if(f.test) return f.test(e)?{...f,listed:true}:null;
    if(f.re.test(perks)) return {...f,listed:true};
    if(f.re.test(text)) return {...f,listed:!["Swag","Food"].includes(f.k)};
    return null;
  }).filter(Boolean);
}
const flairHTML = (e,max=4) => flairsOf(e).slice(0,max).map(f=>`<span class="fl ${f.listed?"":"inf"}" style="--fb:${f.b}" title="${f.listed?"Stated in the listing":"Mentioned in the description"}">${esc(f.k)}</span>`).join("");
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2400)}
async function copy(text,btn){try{await navigator.clipboard.writeText(text);toast("Link copied")}catch{const el=btn?.closest(".reg,.m-body")?.querySelector(".url");if(el){const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r);toast("Selected. Press Ctrl/Cmd+C")}}}
function gcal(e){
  const d=parseISO(e.date); if(!d) return null; const e2=parseISO(e.endDate)||d; const end=new Date(e2); end.setDate(end.getDate()+1);
  const p=new URLSearchParams({action:"TEMPLATE",text:e.title,dates:`${iso(d).replace(/-/g,"")}/${iso(end).replace(/-/g,"")}`,location:[e.venue,"Bengaluru"].filter(Boolean).join(", "),details:`Register: ${e.url||""}`});
  return "https://calendar.google.com/calendar/render?"+p;
}

const S = { view:"discover", q:"", when:store.get("nte:when","upcoming"), domains:new Set(), plats:new Set(), flairs:new Set(), verified:false, sub:null, sort:store.get("nte:sort","date"), layout:store.get("nte:layout","grid"), showAllPlats:false, showAllDoms:false, open:new Set(JSON.parse(store.get("nte:open",'["when","domain"]'))), calMonth:new Date(today.getFullYear(),today.getMonth(),1), calDay:iso(today), saved:[], db:null, sheet:false };
const allEvents = () => [...EVENTS.map(e=>({...e,_src:"library"})), ...S.saved.map(e=>({...e,_src:"saved"}))];
const WHEN = [["today","Today"],["tomorrow","Tomorrow"],["week","Next 7 days"],["month","Next 30 days"],["upcoming","All upcoming"],["all","Include past"]];
if(!WHEN.some(w=>w[0]===S.when)) S.when="upcoming";
const tomorrowISO = (()=>{const d=new Date(today);d.setDate(d.getDate()+1);return iso(d)})();
function passes(e,skip={}){
  const d=parseISO(e.date), dd=d?dayDiff(d,today):999, ended=isPast(e);
  if(!skip.when){
    if(S.when==="today"&&!onDay(e,iso(today))) return false;
    if(S.when==="tomorrow"&&!onDay(e,tomorrowISO)) return false;
    if(S.when==="upcoming"&&ended) return false;
    if(S.when==="week"&&(ended||dd>7)) return false;
    if(S.when==="month"&&(ended||dd>30)) return false;
  }
  if(!skip.domain&&S.domains.size&&!S.domains.has(e.domain)) return false;
  if(!skip.plat&&S.plats.size&&!S.plats.has(e.platform||"Other")) return false;
  if(S.verified&&e.confidence!=="high") return false;
  if(S.flairs.size){ const f=new Set(flairsOf(e).map(x=>x.k)); for(const k of S.flairs) if(!f.has(k)) return false; }
  if(S.sub&&!(e.tags||[]).includes(S.sub)) return false;
  const q=S.q.trim().toLowerCase();
  if(q){const hay=[e.title,e.venue,e.area,e.organizer,e.platform,e.domain,...(e.tags||[]),e.description,e.seenOn].join(" ").toLowerCase(); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;}
  return true;
}
const byDate = (a,b)=>(a.date||"9").localeCompare(b.date||"9");
const SORTS = [
  ["date","Soonest first",byDate],
  ["late","Latest first",(a,b)=>byDate(b,a)],
  ["verified","Verified first",(a,b)=>(a.confidence==="high"?0:1)-(b.confidence==="high"?0:1)||byDate(a,b)],
  ["perks","Most perks",(a,b)=>flairsOf(b).length-flairsOf(a).length||byDate(a,b)],
  ["az","Title A–Z",(a,b)=>a.title.localeCompare(b.title)],
  ["platform","Platform",(a,b)=>(a.platform||"").localeCompare(b.platform||"")||byDate(a,b)],
  ["domain","Domain",(a,b)=>(a.domain||"").localeCompare(b.domain||"")||byDate(a,b)]
];
if(!SORTS.some(s=>s[0]===S.sort)) S.sort="date";
function filtered(list=allEvents(),skip){
  return list.filter(e=>passes(e,skip)).sort(SORTS.find(s=>s[0]===S.sort)[2]);
}

function card(e){

  return `<button class="card ${isPast(e)?"past":""}" style="${dv(e)}" data-open="${esc(k)}" aria-label="${esc(e.title)}, ${esc(fmtDate(e))}, registration on ${esc(e.platform)}">

}

    ${acc("domain","Domain",S.domains.size,top(doms,S.showAllDoms,([d])=>S.domains.has(d.k)).map(([d,c])=>`<label class="opt" style="--dc:${d.c}"><input type="checkbox" data-f="domains" value="${esc(d.k)}" ${S.domains.has(d.k)?"checked":""}><span class="sq"></span><span>${esc(d.k)}</span><span class="n">${c}</span></label>`).join("")+moreBtn(doms,S.showAllDoms,"more-doms"))}
    ${acc("plat","Registered on",S.plats.size,top(plats,S.showAllPlats,([p])=>S.plats.has(p)).map(([p,c])=>`<label class="opt" style="--dc:${platColor(p)}"><input type="checkbox" data-f="plats" value="${esc(p)}" ${S.plats.has(p)?"checked":""}><span class="sq" style="border-radius:2px"></span><span>${esc(p)}</span><span class="n">${c}</span></label>`).join("")+moreBtn(plats,S.showAllPlats,"more-plats"))}

    <button class="fresh" data-fresh>${I.clock}<span>${EVENTS.length} listings · sources &amp; freshness</span></button>
    <div class="sheet-foot"><button class="btn" data-close-sheet>Show ${n} event${n===1?"":"s"}</button></div>`;
  $("#fcount").textContent = filterCount()?` · ${filterCount()}`:"";

function activeChips(){
  const c=[];

/* ---------- query parsing (local) ---------- */
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseQuery(t){
  const out={date:null,time:null,venue:null,keywords:[]}; let m, d=null;
  m=/(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?,?\s*(\d{4})?/i.exec(t);
  if(m) d=new Date(+(m[3]||today.getFullYear()),MONTHS[m[2].toLowerCase()],+m[1]);
  if(!d){ m=/(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/i.exec(t); if(m) d=new Date(+(m[3]||today.getFullYear()),MONTHS[m[1].toLowerCase()],+m[2]); }
  if(!d){ m=/(\d{4})-(\d{2})-(\d{2})/.exec(t); if(m) d=new Date(+m[1],+m[2]-1,+m[3]); }
  if(!d){ m=/\b(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})\b/.exec(t); if(m) d=new Date(+(m[3].length===2?"20"+m[3]:m[3]),+m[2]-1,+m[1]); }
  if(d&&!isNaN(d)) out.date=iso(d);
  m=/(\d{1,2}(?::\d{2})?\s*(?:am|pm))\s*(?:-|–|to)\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm))/i.exec(t); if(m) out.time=`${m[1].toUpperCase()} – ${m[2].toUpperCase()}`;
  const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  out.venue=lines.find(l=>/hotel|conrad|marriott|taj|itc|hyatt|leela|sheraton|ritz|centre|center|convention|campus|hall|park|tower|road|office|hub|bangalore|bengaluru|koramangala|indiranagar|whitefield|hsr/i.test(l)&&!/\d{1,2}:\d{2}/.test(l)&&l.length<90)||null;
  const stop=new Set("the of and a an to in on for with your you our take part meet best include included includes connect experts expert industry future unlocking hands lunch breakfast swag bangalore bengaluru am pm hotel".split(" "));
  out.keywords=[...new Set(t.toLowerCase().replace(/[^a-z0-9+#\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!stop.has(w)&&!(w in MONTHS)&&!/^\d+$/.test(w)))].slice(0,30);
  return out;
}
function localMatches(p){
  const vt=(p.venue||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2&&!["bangalore","bengaluru","hotel","road"].includes(w));
  return allEvents().map(e=>{
    let s=0; const d=parseISO(e.date), qd=parseISO(p.date);
    if(qd&&d){ if(onDay(e,p.date)) s+=50; else if(Math.abs(dayDiff(qd,d))<=1) s+=10; }
    const hayV=((e.venue||"")+" "+(e.area||"")).toLowerCase(); vt.forEach(w=>{if(hayV.includes(w)) s+=12});
    const hay=[e.title,e.description,...(e.tags||[]),e.audience,e.organizer].join(" ").toLowerCase();
    p.keywords.forEach(w=>{if(hay.includes(w)) s+=3});
    return {e,s:Math.min(100,s)};
  }).filter(x=>x.s>=15).sort((a,b)=>b.s-a.s);
}
function platformLinks(p,raw){
  const title=(raw.split("\n").map(s=>s.trim()).find(l=>l.length>15&&!/\d{1,2}:\d{2}|^\d{1,2}\s+\w+\s+\d{4}$/i.test(l)&&l!==p.venue)||p.keywords.slice(0,6).join(" "));
  const dstr=p.date?(()=>{const d=parseISO(p.date);return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`})():"";
  const g=q=>"https://www.google.com/search?q="+encodeURIComponent(q);
  return [["Google",g(`"${title}" Bangalore ${dstr}`)],["Luma",g(`site:lu.ma OR site:luma.com ${title} Bengaluru`)],["Meetup",g(`site:meetup.com ${title} Bangalore`)],["Eventbrite",g(`site:eventbrite.com ${title} Bengaluru`)],["Konfhub",g(`site:konfhub.com ${title}`)],["Allevents",g(`site:allevents.in bangalore ${title}`)],["LinkedIn Events",g(`site:linkedin.com/events ${title} Bengaluru`)],[p.venue?"Venue + date":"Date only",g(`${p.venue||"Bangalore"} tech event ${dstr}`)]];
}

    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div style="display:flex;flex-direction:column;gap:6px">${HOSTED
        ?`<span class="lbl">Live web search</span><h1>Deep Search</h1><p class="sub">Paste a poster caption, LinkedIn post or invite. Claude searches the web, reads the pages and returns the registration link. If it can't pin the event down, you get the other Bengaluru tech events that day.</p>`
        :`<span class="lbl">Match against the library</span><h1>Find an event</h1><p class="sub">Paste a poster caption, LinkedIn post or invite. The page reads the date, time and venue, shows the closest events in the library and everything else on that day, and builds ready-made searches for Luma, Meetup, Konfhub and the Bengaluru listing sites.</p>`}</div>
      <div class="ds-in">
        <label for="dsText" class="lbl">Event details</label>
        <textarea id="dsText" spellcheck="false">${esc(draft)}</textarea>
        <div class="tags" id="dsParsed"></div>
        <div class="actions"><button class="btn" id="dsGo">${HOSTED?"Run deep search":"Find matches"}</button><button class="btn ghost" id="dsStop" hidden>Stop</button><button class="btn ghost" id="dsClear">Clear</button></div>
        <div class="status" id="dsStatus"><i style="background:var(--ink-3)"></i><span>${HOSTED?"Live search runs in the Claude desktop app, which lends its built-in browser. Elsewhere you get library matches and search links.":"Matches update as you type. Live web search is available in the Claude version of this app."}</span></div>
        <div class="log" id="dsLog" hidden></div>
      </div>
    </div>
    <div class="res" id="dsRes"></div>
  </div>`;
}
const chipsFor = p => [p.date&&fmtDate({date:p.date}),p.time,p.venue,p.keywords.length&&`${p.keywords.length} keywords`].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
function setStatus(color,msg){$("#dsStatus").innerHTML=`<i style="background:${color}"></i><span>${esc(msg)}</span>`}
function logLine(msg,live){const l=$("#dsLog");if(!l)return;l.hidden=false;const d=document.createElement("div");if(live)d.className="live";d.textContent=msg;l.append(d);l.scrollTop=l.scrollHeight;}
function wireSearch(){
  const ta=$("#dsText");
  const upd=()=>{DS.parsed=parseQuery(ta.value);$("#dsParsed").innerHTML=chipsFor(DS.parsed)||`<span class="tag">Nothing recognised yet</span>`;store.set("nte:draft",ta.value);if(!HOSTED&&$("#dsRes"))renderLocalOnly();};
  ta.addEventListener("input",upd); upd();
  $("#dsClear").onclick=()=>{ta.value="";upd();ta.focus();};
  $("#dsStop").onclick=()=>DS.ctl?.abort();
  $("#dsGo").onclick=runDeepSearch;
  renderLocalOnly();
}
const linkRow = l => `<div class="links">${l.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("")}</div>`;
const selfSearch = (p,raw) => `<section>${secHead("Search it yourself")}<div style="display:flex;flex-direction:column;gap:12px">${linkRow(platformLinks(p,raw))}<details><summary>Bengaluru listing sites (${AGGREGATORS.length})</summary><div style="margin-top:8px">${linkRow(AGGREGATORS)}</div></details><details><summary>Communities &amp; meetup groups (${COMMUNITIES.length})</summary><div style="margin-top:8px">${linkRow(COMMUNITIES)}</div></details><details><summary>Company &amp; industry event pages (${VENDORS.length})</summary><div style="margin-top:8px">${linkRow(VENDORS)}</div></details></div></section>`;
function renderLocalOnly(){
  const p=DS.parsed; const lm=localMatches(p).slice(0,4);
  const sameDay=p.date?allEvents().filter(e=>onDay(e,p.date)&&!lm.some(x=>x.e===e)):[];
  $("#dsRes").innerHTML=`<div class="note">${HOSTED?"Run a deep search to look across the web. Until then, here is what the library already holds for these details.":`Matched against ${EVENTS.length} events in the library. Not here? Use the ready-made searches below.`}</div>
  ${lm.length?`<section>${secHead("Closest in library",null,null,lm.length)}<div class="list">${lm.map(x=>li(x.e)).join("")}</div></section>`:""}
  ${sameDay.length?`<section>${secHead("Also on "+fmtDate({date:p.date}),null,null,sameDay.length)}<div class="list">${sameDay.map(li).join("")}</div></section>`:""}
  ${selfSearch(p,$("#dsText").value)}`;
}

/* browser tools via the Claude desktop app's built-in browser; one tab, so page loads are queued */
let MCP=null, SAMPLE=null, browserQ=Promise.resolve(), browserOK=null;
function textOf(r){ if(!r) return ""; if(typeof r.payload==="string") return r.payload; const t=(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n"); return t || (r.payload?JSON.stringify(r.payload):""); }
function browse(url,maxChars,signal){
  const job=browserQ.then(async()=>{
    if(signal?.aborted) throw {code:"cancelled"};
    await MCP.callTool("host:claude_browser","navigate",{url},{signal});
    const r=await MCP.callTool("host:claude_browser","get_page_text",{max_chars:maxChars},{signal});
    return textOf(r).slice(0,maxChars);
  });
  browserQ=job.catch(()=>{});
  return job;
}
function browserErr(e){
  const c=e?.code;
  if(["server_not_connected","not_granted","capability_disabled","capability_removed","not_in_manifest","blocked_by_policy"].includes(c)){browserOK=false;return "Live browsing isn't available in this view (it needs the Claude desktop app and the viewer's OK). Use library_events and your own knowledge instead.";}
  if(c==="cancelled") return "The viewer declined or stopped this page load.";
  return "Page could not be loaded ("+(c||e?.message||"error")+").";
}
const TOOLS = () => [
  {name:"web_search",description:"Search the web (DuckDuckGo) and return the results page text: titles, URLs and snippets. Use site: filters (site:lu.ma, site:luma.com, site:meetup.com, site:eventbrite.com, site:konfhub.com, site:allevents.in, site:linkedin.com/events) and quote distinctive phrases.",
   inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},
   async execute(input,ctx){ const q=String(input.query||"").slice(0,300); logLine("search  "+q,true); if(!MCP||browserOK===false) throw new Error("Live browsing unavailable in this view."); try{ const t=await browse("https://html.duckduckgo.com/html/?q="+encodeURIComponent(q),7000,ctx.signal); browserOK=true; return t||"No results text."; }catch(e){ throw new Error(browserErr(e)); } }},
  {name:"read_page",description:"Open a URL in the browser and return its visible text (first ~9000 characters). Use it to confirm an event's title, date, time, venue, perks and registration link, or to read a listing page.",
   inputSchema:{type:"object",properties:{url:{type:"string"}},required:["url"]},
   async execute(input,ctx){ const u=String(input.url||""); if(!/^https?:\/\//.test(u)) throw new Error("Give a full http(s) URL."); logLine("read    "+u,true); if(!MCP||browserOK===false) throw new Error("Live browsing unavailable in this view."); try{ const t=await browse(u,9000,ctx.signal); browserOK=true; return t||"The page had no readable text."; }catch(e){ throw new Error(browserErr(e)); } }},
  {name:"library_events",description:"List events in this app's curated Bengaluru library, optionally only those on a date (YYYY-MM-DD). Returns title, date, time, venue, platform and registration url.",
   inputSchema:{type:"object",properties:{date:{type:"string"}}},
   execute(input){ const q=input.date?String(input.date):null; logLine("library "+(q||"all")); return allEvents().filter(e=>!q||onDay(e,q)).slice(0,60).map(e=>({title:e.title,date:e.date,endDate:e.endDate,time:e.time,venue:e.venue,platform:e.platform,url:e.url,domain:e.domain})); }}
];
function buildPrompt(raw,p){
  return `You are an event-finding researcher for tech events in Bengaluru (Bangalore), India. Today is ${iso(today)}.

The user pasted this description of an event and wants its REGISTRATION link:
"""
${raw.slice(0,4000)}
"""
Parsed hints: date=${p.date||"unknown"}, time=${p.time||"unknown"}, venue=${p.venue||"unknown"}.

How to work (be efficient: you have only a few tool rounds, so call several tools IN PARALLEL in one round):
1. Round 1: library_events for the date, plus 3-4 web_search queries in parallel: the exact headline in quotes + Bengaluru; key phrase + venue + date; site:lu.ma / site:linkedin.com/events / site:konfhub.com variants. Think about likely organisers (a "Generative AI experiences" workshop at a 5-star hotel is often a vendor roadshow: AWS, Google Cloud, Microsoft, NVIDIA, Databricks, Snowflake, Adobe, Salesforce, Intel, IBM, Oracle).
2. Round 2: read_page on the 1-3 most promising result URLs to confirm date, venue and registration link. If the event looks vendor-hosted (a workshop/roadshow at a hotel, "experts", swag), also read the likely vendors' event pages in parallel: ${VENDORS.slice(0,14).map(v=>v[0]+" "+v[1]).join(" ; ")}. Other vendor pages: ${VENDORS.slice(14).map(v=>v[1]).join(" , ")}.
3. Round 3 (only if no match yet): read 2-3 Bengaluru listing sites in parallel and look for other tech events that day. Listing sites: ${AGGREGATORS.map(a=>a[1]).join(" , ")}. Community calendars: ${COMMUNITIES.map(a=>a[1]).join(" , ")}. Also web_search "site:lu.ma bengaluru <date>" and "meetup bangalore <date>".
Never invent URLs. Only return URLs you saw in tool results. Prefer the actual registration page (lu.ma, meetup.com, eventbrite, konfhub, official form) over news or listing pages. If live browsing is unavailable, use the library and say so in "note".

"platform" = where registration happens: one of Luma, Meetup, Eventbrite, Konfhub, Allevents, Devfolio, Unstop, HasGeek, Commudle, GDG Community, Official site, Techsnap, Jamao, Kure-Cal, Bengaluru2Go, Other.
"domain" = one of: AI & ML, Cloud & DevOps, Data, Dev & Web, Security, Web3, Product & Design, Startups, Hardware & IoT, Enterprise.
"perks" = only perks stated on the page (e.g. "Lunch","Breakfast","Swag","Certificate","Prizes").

Reply with ONLY one JSON object:
{"verdict":"exact"|"close"|"not_found",
 "best":null | {"title":"","date":"YYYY-MM-DD","endDate":null,"time":"","venue":"","organizer":"","platform":"","url":"","domain":"","tags":[""],"perks":[""],"price":"Free|Paid|null","description":"","confidence":0-100,"why":"one sentence on what matched and what didn't"},
 "alternatives":[ up to 3 other candidates, same fields ],
 "sameDay":[ up to 8 other Bengaluru tech events on the same date, same fields (confidence optional) ],
 "searched":["the queries you ran"],
 "note":"one short sentence for the user"}
"exact" = same event confirmed on a page. "close" = probably the same or a very similar event, not fully confirmed. "not_found" = no candidate; then fill sameDay.`;
}
async function runDeepSearch(){
  const raw=$("#dsText").value.trim(); if(!raw){setStatus("var(--warn)","Paste some event details first.");return;}
  const p=parseQuery(raw); DS.parsed=p;
  $("#dsLog").innerHTML=""; $("#dsLog").hidden=true;
  if(!HOSTED){ setStatus("var(--ok)","Showing the closest library matches and same-day events."); renderLocalOnly(); return; }
  if(!SAMPLE){ setStatus("var(--warn)","Claude isn't reachable in this view, so this is a library-only match. Open the artifact in the Claude desktop app for a live search."); renderLocalOnly(); return; }
  DS.ctl=new AbortController(); $("#dsGo").disabled=true; $("#dsStop").hidden=false;
  setStatus("var(--accent)","Thinking… a full deep search usually takes 30–120 seconds.");
  $("#dsRes").innerHTML=`<div class="empty">Searching the web for this event…</div>`;
  try{
    const res=await SAMPLE.json(buildPrompt(raw,p),{tools:TOOLS(),signal:DS.ctl.signal,modelTier:"default"});
    renderResult(res,p,raw);
    setStatus(browserOK===false?"var(--warn)":"var(--ok)",browserOK===false?"Done without live browsing. Results come from the library and Claude's own knowledge.":"Done. Check the registration page before you sign up.");
  }catch(e){
    const msg={cancelled:"Stopped.",not_granted:"Claude access was declined for this page, so deep search is off. The library match below still works.",sampling_disabled:"Claude isn't available for this account.",rate_limited:"Too many searches in a short time. Wait a minute and try again.",invalid_json:"Claude's answer couldn't be read. Try again, or trim the pasted text.",tools_unavailable:"This view can't run page tools, so live search is off.",refused:"Claude declined this request. Edit the text and try again."}[e?.code]||"The search was interrupted ("+(e?.code||"error")+"). Try again.";
    setStatus(e?.code==="cancelled"?"var(--ink-3)":"var(--warn)",msg); renderLocalOnly();
  }finally{ $("#dsGo").disabled=false; $("#dsStop").hidden=true; }
}
function normEv(x,i,tag){
  if(!x||!x.title) return null;
  return {title:String(x.title),date:x.date||null,endDate:x.endDate||null,time:x.time||null,venue:x.venue||null,organizer:x.organizer||null,platform:PLATFORMS[x.platform]?x.platform:"Other",url:safeUrl(x.url),domain:DOMAINS.some(d=>d.k===x.domain)?x.domain:"AI & ML",tags:Array.isArray(x.tags)?x.tags.slice(0,6).map(String):[],perks:Array.isArray(x.perks)?x.perks.slice(0,6).map(String):[],price:x.price||null,description:x.description||null,confidence:x.confidence,why:x.why||null,_id:`ds-${tag}-${i}-${hashStr(x.title+x.url)}`,_src:"search"};
}
function resultCard(e,verdict){
  window.__dsReg??=new Map(); window.__dsReg.set(e._id,e);
  const conf=typeof e.confidence==="number"?Math.max(0,Math.min(100,Math.round(e.confidence))):null;
  return `<article class="match" style="${dv(e)}">
    <div class="m-head"><span class="c-dom"><span class="dot"></span>${verdict?`<span class="verdict ${verdict[0]}">${verdict[1]}</span>`:esc(e.domain)}</span>${conf!==null?`<div class="m-pct"><span>${conf}%</span><div class="meter"><i style="width:${conf}%"></i></div></div>`:""}</div>
    <div class="m-body"><h3>${esc(e.title)}</h3>
      <div class="c-meta"><span>${esc(fmtDate(e))}${e.time?` · ${esc(e.time)}`:""}</span>${e.venue?`<span>${esc(e.venue)}</span>`:""}</div>
      <div class="actions"><span class="plat"><i style="background:${platColor(e.platform)}"></i>${esc(e.platform)}</span>${e.organizer?`<span class="tag">${esc(e.organizer)}</span>`:""}</div>
      ${flairsOf(e).length?`<div class="flairs">${flairHTML(e,6)}</div>`:""}
      ${e.why?`<p class="why">${esc(e.why)}</p>`:""}
      ${e.url?`<span class="url">${esc(e.url)}</span>`:""}
      <div class="actions">${e.url?`<a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Register ↗</a><button class="btn ghost" data-copy="${esc(e.url)}">Copy link</button>`:""}<button class="btn ghost" data-open="${esc(e._id)}">Details</button>${S.db?`<button class="btn ghost" data-save="${esc(e._id)}">Save to library</button>`:""}</div>
    </div></article>`;
}
function renderResult(r,p,raw){
  const best=normEv(r?.best,0,"b"), alts=(r?.alternatives||[]).map((x,i)=>normEv(x,i,"a")).filter(Boolean), same=(r?.sameDay||[]).map((x,i)=>normEv(x,i,"s")).filter(Boolean);
  const v=r?.verdict==="exact"?["v-exact","Exact match"]:r?.verdict==="close"?["v-close","Closest find"]:["v-none","Not found"];
  const libSame=p.date?allEvents().filter(e=>onDay(e,p.date)&&!same.some(s=>s.url&&s.url===e.url)&&!(best&&best.url===e.url)):[];
  let h="";
  if(best) h+=resultCard(best,v);
  else h+=`<article class="match"><div class="m-head" style="background:var(--accent-soft)"><span class="verdict v-none">Not found</span></div><div class="m-body"><p class="why">No listing matched these details closely enough.${p.date?` Below is what else is on in Bengaluru on ${esc(fmtDate({date:p.date}))}.`:""}</p></div></article>`;
  if(r?.note) h+=`<div class="note">${esc(r.note)}</div>`;
  if(alts.length) h+=`<section>${secHead("Other candidates",null,null,alts.length)}<div style="display:flex;flex-direction:column;gap:14px">${alts.map(e=>resultCard(e)).join("")}</div></section>`;
  if(same.length||libSame.length) h+=`<section>${secHead("Also on "+(p.date?fmtDate({date:p.date}):"that day"),null,null,same.length+libSame.length)}<div style="display:flex;flex-direction:column;gap:14px">${same.map(e=>resultCard(e)).join("")}${libSame.length?`<div class="list">${libSame.map(li).join("")}</div>`:""}</div></section>`;
  if(r?.searched?.length) h+=`<details><summary>Searches Claude ran (${r.searched.length})</summary><div class="log" style="margin-top:8px">${r.searched.map(s=>`<div>${esc(s)}</div>`).join("")}</div></details>`;
  h+=selfSearch(p,raw);
  $("#dsRes").innerHTML=h;
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-save]"); if(!b||!S.db) return;
  const e=window.__dsReg?.get(b.dataset.save); if(!e) return;
  if(S.saved.some(s=>s.url&&s.url===e.url)){toast("Already in your library");return;}
  b.disabled=true;
  const doc={title:e.title,date:e.date,endDate:e.endDate,time:e.time,venue:e.venue,organizer:e.organizer,platform:e.platform,url:e.url,domain:e.domain,tags:e.tags,perks:e.perks,price:e.price,description:e.description||e.why,confidence:(e.confidence>=85?"high":"medium"),savedAt:new Date().toISOString()};
  try{ await S.db.collection("saved").add(doc); b.textContent="Saved ✓"; toast("Saved to library"); }catch(err){ b.disabled=false; toast("Couldn't save it: "+(err.code||"error")); }
});

/* ---------- boot ---------- */
const h0=location.hash.slice(1); if(["search","saved","calendar"].includes(h0)) S.view=h0;
go(false);
(async()=>{
  if(!window.claude?.use) return;
  claude.use("sample").then(s=>{SAMPLE=s;}).catch(()=>{});
  claude.use("mcp").then(m=>{MCP=m;}).catch(()=>{});
  const db=await claude.use("db").catch(()=>null); if(!db) return;
  S.db=db;
  db.collection("saved").onSnapshot(snap=>{
    S.saved=snap.docs.map(d=>({...d.data(),_id:d.id}));
    renderChrome(); if(S.view!=="search") render();
  },()=>{});
})();
</script>
